<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagebreak Productions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(315deg, #002147 0%, #3b3c36 74%);
            font-family: ivymode-variable, sans-serif;
            font-style: normal;
            font-variation-settings: "ital" 0, "wght" 200;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        .logo {
            width: 250px;
            height: 250px;
            margin-bottom: 2rem;
            object-fit: contain;
        }

        .contact {
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .contact a {
            color: #ffffff;
            text-decoration: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.5);
            padding-bottom: 0.25rem;
            transition: border-color 0.3s ease;
        }

        .contact a:hover {
            border-bottom-color: #ffffff;
        }

        @media (max-width: 768px) {
            .logo {
                width: 180px;
                height: 180px;
            }

            .contact {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="pagebreak.svg" alt="Pagebreak Logo" class="logo">
        
        <div class="contact">
            <a href="mailto:contact@pagebreakproductions.com">contact@pagebreakproductions.com</a>
        </div>
    </div>
</body>
</html>
